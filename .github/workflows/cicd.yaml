name: Build and Push to ACR

on:
  push:
    branches:
      - main  # Triggers the pipeline when you push to main branch

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
    # 1. Checkout repository code
    - name: Checkout Code
      uses: actions/checkout@v4

    # 2. Log in to Azure Container Registry (ACR)
    - name: Log in to Azure Container Registry
      uses: docker/login-action@v3
      with:
        registry: stocksenseacr.azurecr.io
        username: ${{ secrets.ACR_USERNAME }}
        password: ${{ secrets.ACR_PASSWORD }}

    # 3. Build the Docker Image and push it to your registry
    - name: Build and Push Docker Image
      run: |
        docker build -t stocksenseacr.azurecr.io/stocksense:latest .
        docker push stocksenseacr.azurecr.io/stocksense:latest

    # NOTE: Continuous Deployment is enabled for the Web App through an
    # ACR webhook (registry stocksenseacr, fires on push of stocksense:latest).
    # Every push above therefore restarts the Web App on the new image automatically
    # -- no extra GitHub secrets needed.
