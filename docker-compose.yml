# Local development:   docker compose up -d mongo            (just the database)
# Full stack in Docker: docker compose up --build            (mongo + backend + frontend)
#
# Values below are development defaults — override them with a root-level .env
# file (see .env.example) and never reuse them in production.

services:
  mongo:
    image: mongo:8
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    restart: unless-stopped
    depends_on:
      mongo:
        condition: service_healthy
    environment:
      MONGO_URI: mongodb://mongo:27017
      MONGO_DB_NAME: ${MONGO_DB_NAME:-stocksense}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-dev-only-secret-change-me-dev-only-secret-change-me}
      ENVIRONMENT: ${ENVIRONMENT:-development}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      FIRST_ADMIN_EMAIL: ${FIRST_ADMIN_EMAIL:-admin@example.com}
      FIRST_ADMIN_PASSWORD: ${FIRST_ADMIN_PASSWORD:-ChangeMe123!}
      FIRST_ADMIN_NAME: ${FIRST_ADMIN_NAME:-Administrator}
    ports:
      - "8000:8000"

  frontend:
    build:
      context: ./frontend
      args:
        # Baked into the image: where Next.js proxies /api/* to.
        BACKEND_URL: http://backend:8000
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      NEXT_PUBLIC_APP_NAME: ${NEXT_PUBLIC_APP_NAME:-StockSense}
    ports:
      - "3000:3000"

volumes:
  mongo_data:
